[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/env", "backend/.venv", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
files = ["backend/src", "backend/main.py", "backend/tests", "backend/migrations"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
exclude = "backend/(env|\\.venv)"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers --cov=src --cov=main --cov-branch --cov-report=term-missing --cov-report=xml"
markers = [
    "benchmark: performance budget tests, slow and memory-hungry",
    "postgres: isolated PostgreSQL integration; requires TEST_DATABASE_URL",
]

[tool.coverage.run]
relative_files = true

[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true
