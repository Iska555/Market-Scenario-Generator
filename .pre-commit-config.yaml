repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check .
        language: system
        pass_filenames: false
        files: ^(backend/.*\.py|scripts/.*\.py|pyproject\.toml|\.pre-commit-config\.yaml|backend/requirements.*\.txt)$
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format --check backend scripts
        language: system
        pass_filenames: false
        files: ^(backend/.*\.py|scripts/.*\.py|pyproject\.toml|\.pre-commit-config\.yaml|backend/requirements.*\.txt)$
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        pass_filenames: false
        files: ^(backend/.*\.py|pyproject\.toml|\.pre-commit-config\.yaml|backend/requirements.*\.txt)$
