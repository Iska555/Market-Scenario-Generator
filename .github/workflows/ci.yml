name: Quantitative verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: research_test
          POSTGRES_USER: research_test
          POSTGRES_PASSWORD: synthetic-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research_test -d research_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      matrix:
        python: ['3.12', '3.14']
    env:
      LOKY_MAX_CPU_COUNT: '2'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TEST_DATABASE_URL: postgresql+psycopg://research_test:synthetic-ci-password@127.0.0.1:5432/research_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest
      - run: python -m pre_commit run --all-files
      - run: python scripts/benchmark_phase1.py
      - name: Record resolved Python environment
        if: always()
        run: python -m pip freeze > resolved-python-environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-evidence-python-${{ matrix.python }}
          path: |
            coverage.xml
            resolved-python-environment.txt
          if-no-files-found: warn
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
