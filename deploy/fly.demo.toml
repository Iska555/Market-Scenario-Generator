# One permanent machine; fill the app/region only after inspecting authorized target.
app = "stochastic-market-simulator"
primary_region = "iad"

[build]
  dockerfile = "../Dockerfile"

[env]
  PUBLIC_RELEASE_MODE = "1"
  ENABLE_DEMO_PREVIEW = "0"
  ENABLE_PRIVATE_SIMULATIONS = "0"
  FRONTEND_DIST = "/app/frontend-dist"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 4
    hard_limit = 8
  [[http_service.checks]]
    interval = "60s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
